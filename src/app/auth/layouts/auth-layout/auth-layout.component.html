<div class="flex min-h-full flex-col justify-center py-10 sm:px-6 lg:px-8">
  <div class="sm:mx-auto sm:w-full sm:max-w-md">
    <a routerLink="/">
      <img
        src="https://lumina-beauty-bucket.s3.us-east-1.amazonaws.com/static/images/lumina-beauty-logo.png"
        alt="LuminaBeauty"
        class="mx-auto h-18 w-auto cursor-pointer"
      />
    </a>
    @if (router.url === "/auth/login") {
      <h2
        class="mt-6 text-center text-2xl/9 font-bold tracking-tight text-gray-900"
      >
        LOGIN
      </h2>
    } @else if (router.url === "/auth/twofa") {
      <h2
        class="mt-6 text-center text-2xl/9 font-bold tracking-tight text-gray-900"
      >
        Factor de Autenticación
      </h2>
    } @else {
      <h2
        class="mt-6 text-center text-2xl/9 font-bold tracking-tight text-gray-900"
      >
        REGISTER
      </h2>
    }

    <div class="mt-10 sm:mx-auto sm:w-full sm:max-w-120">
      <router-outlet />
    </div>
  </div>
</div>
