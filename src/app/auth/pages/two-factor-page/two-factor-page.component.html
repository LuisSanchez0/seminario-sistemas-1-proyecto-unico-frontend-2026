@if( isSended() ){
  <success-alert success="Se ha enviado el código de validación de forma correcta"></success-alert>
}

<div class="bg-white px-6 py-12 shadow-sm sm:rounded-lg sm:px-12">
  <form class="space-y-6" [formGroup]="twoFactorForm" (ngSubmit)="onSubmit()">
    <div>
      <label for="code" class="block text-sm/6 font-medium text-gray-900"
        >Código de Verificación</label
      >
      <div class="mt-2">
        <input
          formControlName="code"
          type="text"
          name="code"
          required
          autocomplete="false"
          (input)="onCodeInput($event)"
          maxlength="8"
          class="block w-full rounded-md bg-white px-3 py-1.5 text-base text-gray-900 outline-1 -outline-offset-1 outline-gray-300 placeholder:text-gray-400 focus:outline-2 focus:-outline-offset-2 focus:outline-indigo-600 sm:text-sm/6"
        />
      </div>
    </div>

    <div>
      <button
        type="submit"
        class="flex w-full justify-center rounded-md bg-indigo-600 px-3 py-1.5 text-sm/6 font-semibold text-white shadow-xs hover:bg-indigo-500 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600"
      >
        Verifica tu código
      </button>
    </div>
  </form>

  @if( hasError() ){
  <error-alert [errors]="errores"></error-alert>
  }
</div>

<p class="mt-10 text-center text-sm/6 text-gray-500">
  Revisa si el código de verificación se encuentra en la bandeja de Spam
</p>
<p class="mt-10 text-center text-sm/6 text-gray-500">
  No has recibido el correo?
  <button
    (click)="enableButton()"
    [ngClass]="powerClasses()"
    [disabled]="!isEnable()"
  >
    {{ timer() | i18nPlural: errorMapping }}
  </button>
</p>
