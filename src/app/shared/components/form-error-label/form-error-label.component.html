@if (errorMessage; as message) {
  <p
    role="alert"
    class="bg-error/20 text-base-content mt-2 flex items-start gap-2 rounded-lg px-3 py-2 text-sm font-medium"
  >
    <svg
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="1.5"
      aria-hidden="true"
      class="text-error mt-0.5 size-4 shrink-0"
    >
      <path
        d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-2.994-1.5-3.86 0L2.697 16.126ZM12 15.75h.007v.008H12v-.008Z"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    </svg>
    <span>{{ message }}</span>
  </p>
}
