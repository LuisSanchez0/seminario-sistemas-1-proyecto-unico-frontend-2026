<section class="relative min-h-[70vh] overflow-hidden">
  <!-- Decorative background blobs -->
  <div
    class="pointer-events-none absolute -top-32 -left-32 h-96 w-96 rounded-full bg-indigo-100 opacity-40 blur-3xl"
    aria-hidden="true"
  ></div>
  <div
    class="pointer-events-none absolute -bottom-20 -right-20 h-72 w-72 rounded-full bg-blue-100 opacity-40 blur-3xl"
    aria-hidden="true"
  ></div>

  <div class="relative mx-auto flex min-h-[70vh] max-w-7xl items-center justify-center px-4 py-20 sm:px-6 lg:px-8">
    <div
      class="w-full max-w-lg rounded-3xl border border-slate-200 bg-white/80 p-8 text-center shadow-xl backdrop-blur sm:p-12"
    >
      <!-- 404 badge -->
      <p class="mb-2 text-sm font-semibold uppercase tracking-widest text-indigo-500">
        Ruta no disponible
      </p>

      <!-- Large 404 number -->
      <h1
        class="mb-4 bg-gradient-to-r from-blue-600 via-indigo-600 to-purple-600 bg-clip-text text-8xl font-black tracking-tight text-transparent sm:text-9xl"
      >
        404
      </h1>

      <!-- Decorative icon -->
      <div class="mb-6 flex justify-center">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          class="h-16 w-16 text-slate-300"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
          stroke-width="1.5"
          aria-hidden="true"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M9.879 7.519c1.171-1.025 3.071-1.025 4.242 0 1.172 1.025 1.172 2.687 0 3.712-.203.179-.43.326-.67.442-.745.361-1.45.999-1.45 1.827v.75M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Zm-9 5.25h.008v.008H12v-.008Z"
          />
        </svg>
      </div>

      <!-- Title -->
      <h2 class="mb-3 text-2xl font-bold text-slate-800 sm:text-3xl">
        Página no encontrada
      </h2>

      <!-- Description -->
      <p class="mb-2 text-base leading-relaxed text-slate-500">
        La página que estás buscando no existe, fue movida o la dirección ingresada no es correcta.
      </p>
      <p class="mb-8 text-sm text-slate-400">
        Puedes volver al inicio para seguir explorando ProWear.
      </p>

      <!-- CTA button -->
      <a
        routerLink="/"
        class="inline-flex items-center justify-center gap-2 rounded-2xl bg-gradient-to-r from-blue-600 via-indigo-600 to-purple-600 px-6 py-3 text-sm font-semibold text-white shadow-sm transition-all duration-300 hover:-translate-y-0.5 hover:shadow-lg focus:outline-none focus:ring-2 focus:ring-indigo-300"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          class="h-4 w-4"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
          stroke-width="2"
          aria-hidden="true"
        >
          <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5 3 12m0 0 7.5-7.5M3 12h18" />
        </svg>
        Volver al inicio
      </a>
    </div>
  </div>
</section>
