<!--
  Fixed overlay — rendered once in the app root, never duplicated.
  The live-region semantics live on each toast (role + aria-live) instead of on this
  wrapper, so a toast is announced exactly once.
-->
<div class="pointer-events-none fixed inset-0 z-50 flex items-end px-4 py-6 sm:items-start sm:p-6">
  <div class="flex w-full flex-col items-center space-y-3 sm:items-end">
    @for (toast of toasts(); track toast.id) {
      <div
        [attr.role]="toast.type === 'error' ? 'alert' : 'status'"
        [attr.aria-live]="toast.type === 'error' ? 'assertive' : 'polite'"
        aria-atomic="true"
        class="border-base-300 bg-base-100 pointer-events-auto w-full max-w-sm translate-y-0 transform rounded-xl border opacity-100 shadow-lg transition duration-300 ease-out starting:translate-y-2 starting:opacity-0 starting:sm:translate-x-2 starting:sm:translate-y-0"
      >
        <div class="flex items-start gap-3 p-4">
          @switch (toast.type) {
            @case ('success') {
              <span
                class="bg-success text-success-content grid size-8 shrink-0 place-items-center rounded-full"
                aria-hidden="true"
              >
                <svg
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  class="size-5"
                >
                  <path
                    d="M9 12.75 11.25 15 15 9.75M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  />
                </svg>
              </span>
              <span class="sr-only">Éxito:</span>
            }
            @case ('error') {
              <span
                class="bg-error text-error-content grid size-8 shrink-0 place-items-center rounded-full"
                aria-hidden="true"
              >
                <svg
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  class="size-5"
                >
                  <path
                    d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-2.994-1.5-3.86 0L2.697 16.126ZM12 15.75h.007v.008H12v-.008Z"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  />
                </svg>
              </span>
              <span class="sr-only">Error:</span>
            }
            @default {
              <span
                class="bg-info text-info-content grid size-8 shrink-0 place-items-center rounded-full"
                aria-hidden="true"
              >
                <svg
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  class="size-5"
                >
                  <path
                    d="m11.25 11.25.041-.02a.75.75 0 0 1 1.063.852l-.708 2.836a.75.75 0 0 0 1.063.853l.041-.021M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Zm-9-3.75h.008v.008H12V8.25Z"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  />
                </svg>
              </span>
              <span class="sr-only">Información:</span>
            }
          }

          <div class="min-w-0 flex-1 pt-1">
            <p class="text-base-content text-sm font-semibold break-words">{{ toast.title }}</p>
            @if (toast.description) {
              <p class="text-base-content/80 mt-1 text-sm break-words">{{ toast.description }}</p>
            }
          </div>

          <button
            type="button"
            class="btn btn-sm btn-circle btn-ghost -mt-1 -mr-1 shrink-0"
            aria-label="Cerrar notificación"
            (click)="dismiss(toast.id)"
          >
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
              aria-hidden="true"
              class="size-4"
            >
              <path d="M6 18 18 6M6 6l12 12" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </button>
        </div>
      </div>
    }
  </div>
</div>
