<div class="flex py-6 sm:py-10">
  <!-- Product image -->
  <div class="shrink-0">
    <img
      [src]="item().product.imageUrl"
      [alt]="item().product.title"
      class="size-24 rounded-lg bg-gray-100 object-contain sm:size-40"
    />
  </div>

  <!-- Details + controls -->
  <div class="ml-4 flex min-w-0 flex-1 flex-col justify-between sm:ml-6">
    <div class="relative pr-9 sm:grid sm:grid-cols-2 sm:gap-x-6 sm:pr-0">
      <!-- Left column: info -->
      <div>
        <div class="flex justify-between">
          <h3 class="text-sm">
            <a
              [routerLink]="['/product', item().product.slug]"
              class="font-semibold text-gray-800 hover:text-indigo-600 transition-colors"
            >
              {{ item().product.title }}
            </a>
          </h3>
        </div>

        <p class="mt-2 text-sm font-medium text-gray-900">
          {{ item().product.price | currency: 'GTQ' : 'symbol' : '1.2-2' : 'es-GT' }}
          <span class="ml-1 text-xs font-normal text-gray-600">c/u</span>
        </p>
      </div>

      <!-- Right column: quantity + remove -->
      <div class="mt-4 sm:mt-0 sm:pr-9">
        <!-- Quantity stepper -->
        <div class="flex items-center gap-1.5">
          <button
            type="button"
            (click)="onDecrement()"
            [disabled]="item().quantity <= 1"
            class="flex h-11 w-11 items-center justify-center rounded-md border border-gray-300 bg-white text-gray-600 transition-colors hover:bg-gray-50 disabled:cursor-not-allowed disabled:opacity-40"
            aria-label="Disminuir cantidad"
          >
            <svg class="h-3 w-3" fill="currentColor" viewBox="0 0 20 20" aria-hidden="true">
              <path d="M3 10a1 1 0 0 1 1-1h12a1 1 0 1 1 0 2H4a1 1 0 0 1-1-1Z" />
            </svg>
          </button>

          <span class="w-8 text-center text-sm font-semibold text-gray-900">
            {{ item().quantity }}
          </span>

          <button
            type="button"
            (click)="onIncrement()"
            [disabled]="isAtMax()"
            [title]="isAtMax() ? 'Has alcanzado el stock disponible del producto' : ''"
            class="flex h-11 w-11 items-center justify-center rounded-md border border-gray-300 bg-white text-gray-600 transition-colors hover:bg-gray-50 disabled:cursor-not-allowed disabled:opacity-40"
            aria-label="Aumentar cantidad"
          >
            <svg class="h-3 w-3" fill="currentColor" viewBox="0 0 20 20" aria-hidden="true">
              <path
                d="M10 3a1 1 0 0 1 1 1v5h5a1 1 0 1 1 0 2h-5v5a1 1 0 1 1-2 0v-5H4a1 1 0 1 1 0-2h5V4a1 1 0 0 1 1-1Z"
              />
            </svg>
          </button>
        </div>

        <!-- Remove button (top-right corner) -->
        <div class="absolute right-0 top-0">
          <button
            type="button"
            (click)="remove.emit()"
            class="-m-2 inline-flex p-2 text-gray-600 transition-colors hover:text-red-500"
            aria-label="Eliminar artículo"
          >
            <svg
              class="h-5 w-5"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
              viewBox="0 0 24 24"
              aria-hidden="true"
            >
              <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
            </svg>
          </button>
        </div>
      </div>
    </div>

    <!-- Subtotal row -->
    <div class="mt-4 flex items-center justify-between border-t border-gray-100 pt-3">
      <p class="text-xs text-gray-600">Subtotal</p>
      <p class="text-sm font-semibold text-gray-900">
        {{ subtotal() | currency: 'GTQ' : 'symbol' : '1.2-2' : 'es-GT' }}
      </p>
    </div>
  </div>
</div>
