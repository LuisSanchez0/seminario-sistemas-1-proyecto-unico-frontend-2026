<div class="flex flex-col items-center rounded-xl border-2 border-dashed border-gray-200 bg-gray-50 px-6 py-10 text-center">

  <!-- Map pin icon -->
  <svg
    class="mx-auto h-12 w-12 text-gray-300"
    fill="none"
    stroke="currentColor"
    stroke-width="1"
    viewBox="0 0 24 24"
    aria-hidden="true"
  >
    <path
      stroke-linecap="round"
      stroke-linejoin="round"
      d="M15 10.5a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z"
    />
    <path
      stroke-linecap="round"
      stroke-linejoin="round"
      d="M19.5 10.5c0 7.142-7.5 11.25-7.5 11.25S4.5 17.642 4.5 10.5a7.5 7.5 0 1 1 15 0Z"
    />
  </svg>

  <h3 class="mt-4 text-sm font-semibold text-gray-900">
    Sin direcciones guardadas
  </h3>
  <p class="mt-1 text-sm text-gray-500">
    Agrega una dirección de envío para continuar con tu compra.
  </p>

  <button
    type="button"
    (click)="addClicked.emit()"
    class="mt-5 inline-flex items-center gap-1.5 rounded-lg bg-indigo-600 px-4 py-2 text-sm font-medium text-white shadow-sm transition-colors hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2"
  >
    <svg class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true">
      <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
    </svg>
    Agregar dirección
  </button>

</div>
