@if (isOpen()) {

  <div
    class="fixed inset-0 z-50 overflow-y-auto"
    role="alertdialog"
    aria-modal="true"
    aria-labelledby="confirm-dialog-title"
    aria-describedby="confirm-dialog-msg"
  >

    <!-- ── Backdrop ─────────────────────────────────────────────────────── -->
    <div
      class="fixed inset-0 bg-black/40 backdrop-blur-sm"
      aria-hidden="true"
      (click)="closed.emit()"
    ></div>

    <!-- ── Centering wrapper ─────────────────────────────────────────────── -->
    <div class="flex min-h-full items-center justify-center p-4">

      <!-- ── Dialog panel ──────────────────────────────────────────────── -->
      <div
        class="relative w-full max-w-sm rounded-2xl bg-white p-6 shadow-2xl ring-1 ring-black/5"
      >

        <!-- ── Icon + Title + Message ─────────────────────────────────── -->
        <div class="flex flex-col items-center text-center">

          <!-- Contextual icon -->
          <div
            class="flex h-12 w-12 items-center justify-center rounded-full"
            [class]="iconContainerClasses()"
          >
            @if (variant() === 'destructive') {
              <!-- Trash icon -->
              <svg
                class="h-6 w-6"
                [class]="iconClasses()"
                fill="none"
                stroke="currentColor"
                stroke-width="1.5"
                viewBox="0 0 24 24"
                aria-hidden="true"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="m14.74 9-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 0 1-2.244 2.077H8.084a2.25 2.25 0 0 1-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 0 0-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 0 1 3.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 0 0-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 0 0-7.5 0"
                />
              </svg>
            } @else {
              <!-- Info icon -->
              <svg
                class="h-6 w-6"
                [class]="iconClasses()"
                fill="none"
                stroke="currentColor"
                stroke-width="1.5"
                viewBox="0 0 24 24"
                aria-hidden="true"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="m11.25 11.25.041-.02a.75.75 0 0 1 1.063.852l-.708 2.836a.75.75 0 0 0 1.063.853l.041-.021M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Zm-9-3.75h.008v.008H12V8.25Z"
                />
              </svg>
            }
          </div>

          <h2
            id="confirm-dialog-title"
            class="mt-4 text-base font-bold text-gray-900"
          >
            {{ title() }}
          </h2>

          <p
            id="confirm-dialog-msg"
            class="mt-1.5 text-sm leading-relaxed text-gray-500"
          >
            {{ message() }}
          </p>

        </div>

        <!-- ── Optional detail block ─────────────────────────────────── -->
        @if (detail()) {
          <div class="mt-4 flex items-start gap-2.5 rounded-xl bg-gray-50 p-3.5 ring-1 ring-inset ring-gray-200">
            <!-- Location pin icon -->
            <svg
              class="mt-0.5 h-4 w-4 shrink-0 text-gray-400"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
              viewBox="0 0 24 24"
              aria-hidden="true"
            >
              <path stroke-linecap="round" stroke-linejoin="round" d="M15 10.5a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
              <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 10.5c0 7.142-7.5 11.25-7.5 11.25S4.5 17.642 4.5 10.5a7.5 7.5 0 1 1 15 0Z" />
            </svg>
            <p class="text-xs leading-relaxed text-gray-600">
              {{ detail() }}
            </p>
          </div>
        }

        <!-- ── Actions ───────────────────────────────────────────────── -->
        <div class="mt-6 flex flex-col-reverse gap-2 sm:flex-row">

          <button
            type="button"
            (click)="closed.emit()"
            class="flex-1 rounded-xl border border-gray-300 bg-white px-4 py-2.5 text-sm font-medium text-gray-700 transition-colors hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-gray-300 focus:ring-offset-1"
          >
            {{ cancelLabel() }}
          </button>

          <button
            type="button"
            (click)="confirmed.emit()"
            class="flex-1 rounded-xl px-4 py-2.5 text-sm font-semibold shadow-sm transition-colors focus:outline-none focus:ring-2 focus:ring-offset-1"
            [class]="confirmButtonClasses()"
          >
            {{ confirmLabel() }}
          </button>

        </div>

      </div>
    </div>
  </div>

}
