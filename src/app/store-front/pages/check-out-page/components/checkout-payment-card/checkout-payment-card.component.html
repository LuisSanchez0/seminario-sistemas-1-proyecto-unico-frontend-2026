<div class="space-y-4">
  <app-payment-account />

  <!-- ── Comprobante ─────────────────────────────────────────────────────── -->
  <div class="rounded-xl border border-gray-200 bg-white p-5">
    <div class="mb-3 flex items-center justify-between">
      <p class="text-sm font-medium text-gray-900">Comprobante de pago</p>
      <span class="rounded-full bg-gray-100 px-2 py-0.5 text-[11px] font-medium text-gray-700">
        Requerido
      </span>
    </div>

    @if (receiptImage()) {
      <div class="relative overflow-hidden rounded-lg border border-gray-200 bg-gray-50">
        <img
          [src]="receiptImage()"
          alt="Vista previa del comprobante de pago"
          class="h-40 w-full object-contain p-2"
        />
        <div
          class="flex items-center justify-between gap-3 border-t border-gray-200 bg-white px-3 py-2"
        >
          <p class="text-xs text-gray-600">Comprobante cargado</p>
          <button
            type="button"
            (click)="removeReceipt()"
            class="text-xs font-medium text-red-700 hover:text-red-800 focus:outline-none focus-visible:underline"
          >
            Quitar
          </button>
        </div>
      </div>
    } @else {
      <label
        for="receipt-upload"
        class="group flex cursor-pointer flex-col items-center rounded-lg border-2 border-dashed border-gray-300 bg-gray-50 px-4 py-6 text-center transition-colors focus-within:ring-2 focus-within:ring-indigo-500 hover:border-indigo-400 hover:bg-indigo-50"
      >
        <svg
          class="mx-auto h-8 w-8 text-gray-500"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
          viewBox="0 0 24 24"
          aria-hidden="true"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M12 16.5V9.75m0 0 3 3m-3-3-3 3M6.75 19.5a4.5 4.5 0 0 1-1.41-8.775 5.25 5.25 0 0 1 10.338-2.32 3.75 3.75 0 0 1 3.821 6.783"
          />
        </svg>
        <span class="mt-2 text-sm font-medium text-gray-700">Subir comprobante</span>
        <span class="mt-0.5 text-xs text-gray-600">PNG, JPG o WebP — máx. 8 MB</span>
        <input
          id="receipt-upload"
          type="file"
          accept="image/png,image/jpeg,image/webp"
          class="sr-only"
          (change)="onFileChange($event)"
        />
      </label>
    }

    @if (fileError()) {
      <p role="alert" class="mt-2 text-xs text-red-700">{{ fileError() }}</p>
    }
  </div>
</div>
