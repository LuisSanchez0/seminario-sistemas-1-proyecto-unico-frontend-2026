<el-dialog>
  <dialog id="sidebar" class="backdrop:bg-transparent lg:hidden">
    <el-dialog-backdrop
      class="fixed inset-0 bg-gray-900/80 transition-opacity duration-300 ease-linear data-closed:opacity-0"
    ></el-dialog-backdrop>

    <div tabindex="0" class="fixed inset-0 flex focus:outline-none">
      <el-dialog-panel
        class="group/dialog-panel relative mr-16 flex w-full max-w-xs flex-1 transform transition duration-300 ease-in-out data-closed:-translate-x-full"
      >
        <div
          class="absolute top-0 left-full flex w-16 justify-center pt-5 duration-300 ease-in-out group-data-closed/dialog-panel:opacity-0"
        >
          <button
            type="button"
            command="close"
            commandfor="sidebar"
            class="-m-2.5 p-2.5"
          >
            <span class="sr-only">Close sidebar</span>
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
              data-slot="icon"
              aria-hidden="true"
              class="size-6 text-white"
            >
              <path
                d="M6 18 18 6M6 6l12 12"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </button>
        </div>

        <!-- Sidebar component, swap this element with another sidebar if you like -->
        <div
          class="relative flex grow flex-col gap-y-5 overflow-y-auto bg-white px-6 pb-2"
        >
          <div class="relative flex h-16 shrink-0 items-center">
            <img
              src="https://prowear-s3-bucket.s3.us-east-1.amazonaws.com/static/images/ChatGPT+Image+23+abr+2026%2C+12_23_48+p.m..png"
              alt="ProWear"
              class="h-16 w-auto"
            />
          </div>
          <nav class="relative flex flex-1 flex-col">
            <ul role="list" class="flex flex-1 flex-col gap-y-7">
              <li class="flex flex-1 flex-col">
                <!-- Bloque de enlaces -->
                <ul role="list" class="-mx-2 space-y-1 flex-1">
                  <li>
                    <a
                      href="#"
                      routerLinkActive="text-indigo-600 bg-gray-50"
                      class="group flex gap-x-3 rounded-md bg-gray-50 p-2 text-sm/6 font-semibold text-gray-700 hover:bg-gray-50 hover:text-indigo-600"
                    >
                      <svg
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="1.5"
                        data-slot="icon"
                        aria-hidden="true"
                        routerLinkActive="text-indigo-600"
                        class="size-6 shrink-0 text-gray-400 group-hover:text-indigo-600"
                      >
                        <path
                          d="m2.25 12 8.954-8.955c.44-.439 1.152-.439 1.591 0L21.75 12M4.5 9.75v10.125c0 .621.504 1.125 1.125 1.125H9.75v-4.875c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21h4.125c.621 0 1.125-.504 1.125-1.125V9.75M8.25 21h8.25"
                          stroke-linecap="round"
                          stroke-linejoin="round"
                        />
                      </svg>
                      Dashboard
                    </a>
                  </li>

                  <li>
                    <a
                      routerLink="/admin/products"
                      routerLinkActive="bg-gray-50 text-indigo-600"
                      class="group flex gap-x-3 rounded-md p-2 text-sm/6 font-semibold text-gray-700 hover:bg-gray-50 hover:text-indigo-600"
                    >
                      <svg
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="1.5"
                        data-slot="icon"
                        aria-hidden="true"
                        routerLinkActive="text-indigo-600"
                        class="size-6 shrink-0 text-gray-400 group-hover:text-indigo-600"
                      >
                        <path
                          d="M15 19.128a9.38 9.38 0 0 0 2.625.372 9.337 9.337 0 0 0 4.121-.952 4.125 4.125 0 0 0-7.533-2.493M15 19.128v-.003c0-1.113-.285-2.16-.786-3.07M15 19.128v.106A12.318 12.318 0 0 1 8.624 21c-2.331 0-4.512-.645-6.374-1.766l-.001-.109a6.375 6.375 0 0 1 11.964-3.07M12 6.375a3.375 3.375 0 1 1-6.75 0 3.375 3.375 0 0 1 6.75 0Zm8.25 2.25a2.625 2.625 0 1 1-5.25 0 2.625 2.625 0 0 1 5.25 0Z"
                          stroke-linecap="round"
                          stroke-linejoin="round"
                        />
                      </svg>
                      Productos
                    </a>
                  </li>

                  <li>
                    <a
                      routerLink="/admin/sells"
                      routerLinkActive="bg-gray-50 text-indigo-600"
                      class="group flex gap-x-3 rounded-md p-2 text-sm/6 font-semibold text-gray-700 hover:bg-gray-50 hover:text-indigo-600"
                    >
                      <svg
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="1.5"
                        data-slot="icon"
                        aria-hidden="true"
                        routerLinkActive="text-indigo-600"
                        class="size-6 shrink-0 text-gray-400 group-hover:text-indigo-600"
                      >
                        <path
                          d="M15.75 10.5V6a3.75 3.75 0 1 0-7.5 0v4.5m11.356-1.993 1.263 12c.07.665-.45 1.243-1.119 1.243H4.25a1.125 1.125 0 0 1-1.12-1.243l1.264-12A1.125 1.125 0 0 1 5.513 7.5h12.974c.576 0 1.059.435 1.119 1.007Z"
                          stroke-linecap="round"
                          stroke-linejoin="round"
                        />
                      </svg>
                      Pedidos
                    </a>
                  </li>
                </ul>

                <!-- Botón separado con mt-auto -->
                <div class="mt-auto pt-10">
                  <button
                    type="button"
                    (click)="logout()"
                    class="w-full rounded-full bg-red-600 px-4 py-2.5 text-sm font-semibold text-white shadow-xs hover:bg-red-500 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-red-600"
                  >
                    Cerrar Sesión
                  </button>
                </div>
              </li>
            </ul>
          </nav>
        </div>
      </el-dialog-panel>
    </div>
  </dialog>
</el-dialog>

                </li>
              </ul>
            </li>
          </ul>
        </li>
        <div class="divider my-2"></div>
        <li class="mx-auto mt-auto mb-4">
          <button

<div
  class="sticky top-0 z-40 flex items-center gap-x-6 bg-white px-4 py-4 shadow-xs sm:px-6 lg:hidden"
>
  <button
    type="button"
    command="show-modal"
    commandfor="sidebar"
    class="-m-2.5 p-2.5 text-gray-700 hover:text-gray-900 lg:hidden"
  >
    <span class="sr-only">Abrir SlideBar</span>
    <svg
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="1.5"
      data-slot="icon"
      aria-hidden="true"
      class="size-6"
    >
      <path
        d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    </svg>
  </button>
  <div class="flex-1 text-sm/6 font-semibold text-gray-900">
    Admin Dashboard
  </div>
  <a href="#">
    <span class="sr-only">Tu Perfil</span>
    <span aria-hidden="true"
      >Bienvenido, {{ user()?.name?.split!(" ")[0] }}</span
    >
  </a>
</div>

  </div>
