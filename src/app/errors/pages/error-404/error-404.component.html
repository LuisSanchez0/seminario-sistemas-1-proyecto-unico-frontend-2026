<main
  class="relative flex min-h-screen items-center justify-center overflow-hidden bg-gradient-to-b from-white via-slate-50 to-indigo-50 px-4 py-20 sm:px-6 lg:px-8"
>
  <!-- Decorative background blobs -->
  <div
    class="pointer-events-none absolute -top-40 -left-40 h-[28rem] w-[28rem] rounded-full bg-indigo-100 opacity-50 blur-3xl"
    aria-hidden="true"
  ></div>
  <div
    class="pointer-events-none absolute -bottom-32 -right-32 h-80 w-80 rounded-full bg-blue-100 opacity-50 blur-3xl"
    aria-hidden="true"
  ></div>
  <div
    class="pointer-events-none absolute top-1/2 left-1/2 h-48 w-48 -translate-x-1/2 -translate-y-1/2 rounded-full bg-purple-100 opacity-30 blur-2xl"
    aria-hidden="true"
  ></div>

  <div
    class="relative z-10 w-full max-w-lg rounded-3xl border border-slate-200 bg-white/80 p-8 text-center shadow-xl backdrop-blur sm:p-12"
  >
    <!-- Brand -->
    <p class="mb-3 text-lg font-black tracking-widest text-indigo-600">
      Lumina Beauty
    </p>

    <!-- 404 badge -->
    <p class="mb-1 text-xs font-semibold uppercase tracking-widest text-slate-400">
      Ruta no disponible
    </p>

    <!-- Large 404 number -->
    <h1
      class="mb-4 bg-gradient-to-r from-blue-600 via-indigo-600 to-purple-600 bg-clip-text text-8xl font-black tracking-tight text-transparent sm:text-9xl"
    >
      404
    </h1>

    <!-- Decorative icon -->
    <div class="mb-6 flex justify-center">
      <svg
        xmlns="http://www.w3.org/2000/svg"
        class="h-16 w-16 text-slate-200"
        fill="none"
        viewBox="0 0 24 24"
        stroke="currentColor"
        stroke-width="1.5"
        aria-hidden="true"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z"
        />
      </svg>
    </div>

    <!-- Title -->
    <h2 class="mb-3 text-2xl font-bold text-slate-800 sm:text-3xl">
      Página no encontrada
    </h2>

    <!-- Description -->
    <p class="mb-2 text-base leading-relaxed text-slate-500">
      La página que estás buscando no existe, fue movida o la dirección ingresada no es correcta.
    </p>
    <p class="mb-8 text-sm text-slate-400">
      Puedes volver al inicio para seguir explorando Lumina Beauty.
    </p>

    <!-- CTA button -->
    <a
      routerLink="/"
      class="inline-flex items-center justify-center gap-2 rounded-2xl bg-gradient-to-r from-blue-600 via-indigo-600 to-purple-600 px-6 py-3 text-sm font-semibold text-white shadow-sm transition-all duration-300 hover:-translate-y-0.5 hover:shadow-lg focus:outline-none focus:ring-2 focus:ring-indigo-300"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        class="h-4 w-4"
        fill="none"
        viewBox="0 0 24 24"
        stroke="currentColor"
        stroke-width="2"
        aria-hidden="true"
      >
        <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5 3 12m0 0 7.5-7.5M3 12h18" />
      </svg>
      Volver al inicio
    </a>
  </div>
</main>
